name: Validate application

on:
  push:
    branches:
      - main
      - feature/gestion-operacion-lactea
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Install Firestore rules test tools
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing firebase-tools
      - name: Firestore security rules tests
        run: npx firebase emulators:exec --only firestore --project demo-flow-pos-lite "node --test tests/firestore.rules.test.mjs"
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
